# FILES
defaults: # (these specify which config FILES to use)
  ############## TRAIN ###################################
  - train/config: splade
  - train/data: distil_from_bm25
  - train/model: bert_cased_nochange_reg
  ############## INDEX ###################################
  - index: msmarco
  ############## RETRIEVE ################################
  - retrieve_evaluate: all
  ############### FLOPS ##################################
  - flops: msmarco

# Direct PARAMETER setting
config:
  loss: DistilMarginMSE
  regularizer:
    FLOPS:
      lambda_q: 0.5
      lambda_d: 0.4
      T: 50000
      targeted_rep: rep
      reg: FLOPS
    CASED:
      lambda_q: 0.2
      lambda_d: 0.2
      T: 10000
      targeted_rep: rep
      reg: CASED
      tokenizer_name_or_obj: bert-base-cased
  checkpoint_dir: models/bert_cased_nochange_reg_2/checkpoint
  index_dir: models/bert_cased_nochange_reg_2/index
  out_dir: models/bert_cased_nochange_reg_2/out